name: Release and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-and-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semver release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and build
        run: bun run build

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./node_modules/.bin/semantic-release

  deploy:
    name: Deploy to Vercel production
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/main'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Vercel secrets
        run: |
          missing=0

          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret: VERCEL_TOKEN"
            missing=1
          fi

          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::Missing GitHub Actions secret: VERCEL_ORG_ID"
            missing=1
          fi

          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing GitHub Actions secret: VERCEL_PROJECT_ID"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Pull Vercel environment
        run: ./node_modules/.bin/vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        run: ./node_modules/.bin/vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: ./node_modules/.bin/vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
